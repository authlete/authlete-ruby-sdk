name: Publish
permissions:
  checks: write
  contents: write
  pull-requests: write
  statuses: write
  id-token: write
"on":
  push:
    branches:
      - main
    paths:
      - .speakeasy/gen.lock
  workflow_dispatch: {}
jobs:
  # Check before publishing: a released gem version can be yanked but never
  # reused. These offline tests fail if the IdP require line patched into the
  # gem entry point (.speakeasy/patches) is missing.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - run: grep -q "require_relative 'authlete/idp'" lib/authlete_ruby_sdk.rb
      - run: bundle exec ruby -Ilib test/idp_routing_test.rb
  publish:
    needs: test
    uses: speakeasy-api/sdk-generation-action/.github/workflows/sdk-publish.yaml@v15
    with:
      target: authlete
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}
      rubygems_auth_token: ${{ secrets.RUBYGEMS_AUTH_TOKEN }}
      speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
